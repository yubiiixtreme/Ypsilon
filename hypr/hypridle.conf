# Ypsilon — hypridle. Standalone; run via:
#   hypridle -c ~/Projects/Ypsilon/hypr/hypridle.conf
general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/Projects/Ypsilon/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
