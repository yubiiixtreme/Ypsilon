# Ypsilon — keybinds (SUPER-based, Caelestia-compatible, non-destructive)
# Shell windows (work once `ags` runs; `ags toggle` flips visibility):
#   SUPER+Space = launcher, SUPER+C = control center, SUPER+N = notifications,
#   SUPER+Tab = overview, SUPER+Shift+Q = powermenu
$mod = SUPER
bind = $mod, Return, exec, foot || kitty || alacritty
bind = $mod, Space, exec, ags toggle ypsilon-launcher || fuzzel
bind = $mod, C, exec, ags toggle ypsilon-control
bind = $mod, N, exec, ags toggle ypsilon-notif-center || true
bind = $mod, Tab, exec, ags toggle ypsilon-overview
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exec, ags toggle ypsilon-power
bind = $mod, L, exec, pidof hyprlock || hyprlock -c ~/Projects/Ypsilon/hypr/hyprlock.conf
bind = $mod, W, exec, ~/Projects/Ypsilon/scripts/wallpaper.sh next
bind = $mod, F, fullscreen,
bind = $mod, V, togglefloating,
bind = $mod, J, togglesplit,
# workspaces 1-5
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
# screenshots (grim+slurp if present)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy || true
bind = $mod, Print, exec, grim - | wl-copy || true
# media keys: change + show OSD (needs `ags` running for the popup part)
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && ags request osd volume || true
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ags request osd volume || true
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ags request osd volume || true
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && ags request osd brightness || true
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && ags request osd brightness || true
bind = , XF86AudioPlay, exec, ags request osd volume || true
