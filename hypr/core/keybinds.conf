# Ypsilon — keybinds (SUPER-based). Validate with: scripts/check.sh
# The text after `#` on each bind is what the cheatsheet (SUPER+/) shows — keep it human.
# $ypsilon / $YPSILON come from generated/paths.conf (real repo location)
$mod = SUPER

# --- shell ---
bind = $mod, Space, exec, ags toggle -i ypsilon ypsilon-launcher || fuzzel   # App launcher & search
bind = $mod, C, exec, ags toggle -i ypsilon ypsilon-control                  # Control center
bind = $mod SHIFT, C, exec, ags toggle -i ypsilon ypsilon-dashboard          # Dashboard (calendar, stats)
bind = $mod, N, exec, ags toggle -i ypsilon ypsilon-notif-center             # Notifications
bind = $mod, Tab, exec, ags toggle -i ypsilon ypsilon-overview               # Workspace overview
bind = $mod, I, exec, ags request -i ypsilon settings                        # Settings
bind = $mod, slash, exec, ags toggle -i ypsilon ypsilon-cheatsheet           # This keybind list
bind = $mod SHIFT, W, exec, ags toggle -i ypsilon ypsilon-wallpapers         # Wallpaper picker
bind = $mod, X, exec, $ypsilon wallpaper next                                # Next wallpaper
bind = $mod SHIFT, V, exec, $ypsilon clip                                    # Clipboard history
bind = $mod SHIFT, Q, exec, ags toggle -i ypsilon ypsilon-power              # Power menu
bind = $mod, L, exec, $ypsilon lock                                          # Lock screen

# --- apps ---
bind = $mod, Return, exec, $ypsilon terminal     # Terminal (Settings → Apps)
bind = CTRL ALT, T, exec, $ypsilon terminal      # Terminal
bind = $mod, W, exec, $ypsilon browser           # Web browser
bind = $mod, E, exec, thunar || dolphin || nautilus   # File manager

# --- windows ---
bind = $mod, Q, killactive,                      # Close window
bind = $mod, F, fullscreen,                      # Fullscreen
bind = $mod, V, togglefloating,                  # Float / tile window
bind = $mod SHIFT, P, pin,                       # Pin floating window on all workspaces
bind = $mod, J, layoutmsg, togglesplit           # Flip split direction
bind = $mod, M, exec, $ypsilon layout toggle     # Switch layout (dwindle / master)
bind = $mod, T, togglegroup,                     # Group windows into tabs
bind = $mod, bracketright, changegroupactive, f  # Next tab in group
bind = $mod, bracketleft, changegroupactive, b   # Previous tab in group
bind = ALT, Tab, cyclenext,                      # Cycle windows
bind = $mod, left, movefocus, l                  # Focus left
bind = $mod, right, movefocus, r                 # Focus right
bind = $mod, up, movefocus, u                    # Focus up
bind = $mod, down, movefocus, d                  # Focus down
bind = $mod SHIFT, left, movewindow, l           # Move window left
bind = $mod SHIFT, right, movewindow, r          # Move window right
bind = $mod SHIFT, up, movewindow, u             # Move window up
bind = $mod SHIFT, down, movewindow, d           # Move window down
bind = $mod CTRL, left, resizeactive, -40 0      # Narrower
bind = $mod CTRL, right, resizeactive, 40 0      # Wider
bind = $mod CTRL, up, resizeactive, 0 -40        # Shorter
bind = $mod CTRL, down, resizeactive, 0 40       # Taller
bindm = $mod, mouse:272, movewindow              # Drag to move window
bindm = $mod, mouse:273, resizewindow            # Drag to resize window
bind = $mod SHIFT, E, exit,                      # Log out (quit Hyprland)

# --- workspaces 1-10 (the bar shows `workspaces` from config.json) ---
bind = $mod, 1, workspace, 1                     # Workspace 1
bind = $mod, 2, workspace, 2                     # Workspace 2
bind = $mod, 3, workspace, 3                     # Workspace 3
bind = $mod, 4, workspace, 4                     # Workspace 4
bind = $mod, 5, workspace, 5                     # Workspace 5
bind = $mod, 6, workspace, 6                     # Workspace 6
bind = $mod, 7, workspace, 7                     # Workspace 7
bind = $mod, 8, workspace, 8                     # Workspace 8
bind = $mod, 9, workspace, 9                     # Workspace 9
bind = $mod, 0, workspace, 10                    # Workspace 10
bind = $mod SHIFT, 1, movetoworkspace, 1         # Move window to workspace 1
bind = $mod SHIFT, 2, movetoworkspace, 2         # Move window to workspace 2
bind = $mod SHIFT, 3, movetoworkspace, 3         # Move window to workspace 3
bind = $mod SHIFT, 4, movetoworkspace, 4         # Move window to workspace 4
bind = $mod SHIFT, 5, movetoworkspace, 5         # Move window to workspace 5
bind = $mod SHIFT, 6, movetoworkspace, 6         # Move window to workspace 6
bind = $mod SHIFT, 7, movetoworkspace, 7         # Move window to workspace 7
bind = $mod SHIFT, 8, movetoworkspace, 8         # Move window to workspace 8
bind = $mod SHIFT, 9, movetoworkspace, 9         # Move window to workspace 9
bind = $mod SHIFT, 0, movetoworkspace, 10        # Move window to workspace 10
bind = $mod, grave, workspace, previous          # Previous workspace
bind = $mod, S, togglespecialworkspace, magic    # Scratchpad (show / hide)
bind = $mod SHIFT, S, movetoworkspace, special:magic   # Move window to scratchpad
bind = $mod, mouse_down, workspace, e+1          # Next workspace
bind = $mod, mouse_up, workspace, e-1            # Previous workspace (scroll)

# --- capture ---
bind = , Print, exec, $ypsilon shot select       # Screenshot an area
bind = $mod, Print, exec, $ypsilon shot full     # Screenshot the whole screen
bind = $mod SHIFT, R, exec, $ypsilon record toggle   # Record an area (again to stop)
bind = $mod, P, exec, $ypsilon pick              # Color picker

# --- system ---
bind = $mod SHIFT, G, exec, $ypsilon gamemode toggle     # Game mode (max performance)
bind = $mod SHIFT, N, exec, $ypsilon nightlight toggle   # Night light

# --- media keys: repeat + work on the lockscreen; OSD needs `ags` running ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && ags request -i ypsilon osd volume   # Volume up
bindel = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ags request -i ypsilon osd volume   # Volume down
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ags request -i ypsilon osd volume   # Mute
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 5%+ && ags request -i ypsilon osd brightness   # Brightness up
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%- && ags request -i ypsilon osd brightness   # Brightness down
bindl = , XF86AudioPlay, exec, playerctl play-pause   # Play / pause
bindl = , XF86AudioNext, exec, playerctl next         # Next track
bindl = , XF86AudioPrev, exec, playerctl previous     # Previous track
