# Ypsilon — keybinds (SUPER-based). Validate with: scripts/check.sh
# Shell windows (`ags toggle` flips visibility):
#   SUPER+Space launcher · SUPER+C control · SUPER+N notifications
#   SUPER+Tab overview · SUPER+Shift+Q power · SUPER+Shift+C dashboard · SUPER+/ cheatsheet · SUPER+I settings
$mod = SUPER
# $ypsilon / $YPSILON come from generated/paths.conf (real repo location)

# --- apps & shell ---
bind = $mod, Return, exec, foot || kitty || alacritty
bind = $mod, Space, exec, ags toggle -i ypsilon ypsilon-launcher || fuzzel
bind = $mod, C, exec, ags toggle -i ypsilon ypsilon-control
bind = $mod SHIFT, C, exec, ags toggle -i ypsilon ypsilon-dashboard
bind = $mod, slash, exec, ags toggle -i ypsilon ypsilon-cheatsheet
bind = $mod, I, exec, ags request -i ypsilon settings
bind = $mod SHIFT, W, exec, ags toggle -i ypsilon ypsilon-wallpapers
bind = $mod, N, exec, ags toggle -i ypsilon ypsilon-notif-center
bind = $mod, Tab, exec, ags toggle -i ypsilon ypsilon-overview
bind = $mod SHIFT, Q, exec, ags toggle -i ypsilon ypsilon-power
bind = $mod, L, exec, $ypsilon lock
bind = $mod, W, exec, xdg-open about:blank
bind = $mod, E, exec, thunar || dolphin || nautilus
bind = $mod, X, exec, $ypsilon wallpaper next
bind = $mod SHIFT, V, exec, $ypsilon clip
bind = $mod, P, exec, $ypsilon pick
bind = $mod SHIFT, G, exec, $ypsilon gamemode toggle
bind = $mod SHIFT, N, exec, $ypsilon nightlight toggle

# --- windows ---
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, F, fullscreen,
bind = $mod, V, togglefloating,
bind = $mod, J, layoutmsg, togglesplit
bind = $mod, T, togglegroup,
bind = $mod, bracketright, changegroupactive, f
bind = $mod, bracketleft, changegroupactive, b
bind = $mod SHIFT, P, pin,
bind = $mod, M, exec, $ypsilon layout toggle
bind = $mod, grave, workspace, previous
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = $mod CTRL, left, resizeactive, -40 0
bind = $mod CTRL, right, resizeactive, 40 0
bind = $mod CTRL, up, resizeactive, 0 -40
bind = $mod CTRL, down, resizeactive, 0 40
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- workspaces 1-10 (bar shows `workspaces` from config.json), scratchpad, scroll ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# --- capture ---
bind = , Print, exec, $ypsilon shot select
bind = $mod, Print, exec, $ypsilon shot full
bind = $mod SHIFT, R, exec, $ypsilon record toggle

# --- media keys: repeat + work on the lockscreen; OSD needs `ags` running ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && ags request -i ypsilon osd volume
bindel = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ags request -i ypsilon osd volume
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && ags request -i ypsilon osd volume
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 5%+ && ags request -i ypsilon osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%- && ags request -i ypsilon osd brightness
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
