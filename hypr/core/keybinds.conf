# Ypsilon — keybinds (SUPER-based, Caelestia-compatible, non-destructive)
# Shell windows (work once `ags` runs):
#   SUPER+Space = launcher, SUPER+C = control center, SUPER+V = clipboard
$mod = SUPER
bind = $mod, Return, exec, foot || kitty || alacritty
bind = $mod, Space, exec, ags -t ypsilon-launcher || fuzzel
bind = $mod, C, exec, ags -t ypsilon-control || true
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exec, ags -t ypsilon-powermenu || hyprctl dispatch exit
bind = $mod, F, fullscreen,
bind = $mod, V, togglefloating,
bind = $mod, J, togglesplit,
# workspaces 1-5
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
# screenshots (grim+slurp if present)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy || true
