# Ypsilon — rules: glass layer-shell, floaters, PiP
# Syntax: Hyprland 0.53+ (`rule on, match:field regex`).
layerrule = blur on, match:namespace ^(gtk4-layer-shell|gtk-layer-shell)$
layerrule = ignore_alpha 0, match:namespace ^(gtk4-layer-shell|gtk-layer-shell)$
# Ypsilon shell surfaces (namespace prop in widgets/*.tsx)
layerrule = blur on, match:namespace ^ypsilon-
layerrule = ignore_alpha 0.3, match:namespace ^ypsilon-
# desktop layers (screen corners, wallpaper clock): nothing behind them to blur, corners never animate
layerrule = blur off, match:namespace ^ypsilon-(corner|desktop)$
layerrule = no_anim on, match:namespace ^ypsilon-corner$
# OSD and toasts slide; popups animate themselves (Revealer)
layerrule = animation slide, match:namespace ^(ypsilon-osd|ypsilon-toast|ypsilon-bar)$
# region selection (slurp) and color picker appear instantly, no fade-in delay
layerrule = no_anim on, match:namespace ^(selection|hyprpicker)$

# Drop-down terminal (SUPER+SHIFT+Return) and system monitor (CTRL+SHIFT+Esc) live in their
# own special workspaces; the app is started the first time the workspace is shown
workspace = special:term, on-created-empty:$ypsilon terminal
workspace = special:sysmon, on-created-empty:$ypsilon term btop

# A lone tiled window gets slimmer outer gaps — small laptop screens need every pixel
workspace = w[tv1], gapsout:6
windowrule = float on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol|blueman-manager|nm-connection-editor)$
windowrule = size 700 500, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol|blueman-manager|nm-connection-editor)$
windowrule = center on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol|blueman-manager|nm-connection-editor)$
# small settings tools and calculators float, centered
windowrule = float on, match:class ^(nwg-look|qt5ct|qt6ct|kvantummanager|file-roller|org.gnome.FileRoller|org.gnome.Calculator|qalculate-gtk)$
windowrule = center on, match:class ^(nwg-look|qt5ct|qt6ct|kvantummanager|file-roller|org.gnome.FileRoller|org.gnome.Calculator|qalculate-gtk)$

# Picture-in-picture: floating, pinned, small, bottom-right — stays above
# fullscreen apps (YouTube F / SUPER+F). New `rule =` syntax is required for
# render_in_top_layer + suppress_fullscreen (old windowrule = rejects them).
rule = float on, match:title ^(Picture-in-Picture|Picture in picture|Picture-In-Picture)$
rule = pin on, match:title ^(Picture-in-Picture|Picture in picture|Picture-In-Picture)$
rule = render_in_top_layer on, match:title ^(Picture-in-Picture|Picture in picture|Picture-In-Picture)$
rule = suppress_fullscreen on, match:title ^(Picture-in-Picture|Picture in picture|Picture-In-Picture)$
rule = size 480 270, match:title ^(Picture-in-Picture|Picture in picture|Picture-In-Picture)$
rule = move (monitor_w-window_w-16) (monitor_h-window_h-16), match:title ^(Picture-in-Picture|Picture in picture|Picture-In-Picture)$
rule = keep_aspect_ratio on, match:title ^(Picture-in-Picture|Picture in picture|Picture-In-Picture)$
rule = no_focus on, match:title ^(Picture-in-Picture|Picture in picture|Picture-In-Picture)$
rule = idle_inhibit always, match:title ^(Picture-in-Picture|Picture in picture|Picture-In-Picture)$
# ypsilon pip (SUPER+ALT+V): any window tagged ypsilon-pip floats above fullscreen
rule = float on, match:tag ypsilon-pip
rule = pin on, match:tag ypsilon-pip
rule = render_in_top_layer on, match:tag ypsilon-pip
rule = suppress_fullscreen on, match:tag ypsilon-pip
rule = keep_aspect_ratio on, match:tag ypsilon-pip
rule = no_focus on, match:tag ypsilon-pip
rule = idle_inhibit always, match:tag ypsilon-pip
# any pinned floating window (SUPER+SHIFT+P) also renders above fullscreen apps
rule = render_in_top_layer on, match:pinned 1 match:floating 1
rule = suppress_fullscreen on, match:pinned 1 match:floating 1
# video players float nicely when asked (SUPER+V then SUPER+SHIFT+P)
rule = keep_aspect_ratio on, match:class ^(mpv|vlc|io.github.celluloid.Celluloid|celluloid|haruna|dragonplayer)$

# Dialogs & pickers float and center
windowrule = float on, match:class ^(org.freedesktop.impl.portal.desktop.*|xdg-desktop-portal.*|polkit-.*|hyprpolkitagent)$
windowrule = float on, match:title ^(Open File|Save File|Open Folder|Choose.*)$
windowrule = center on, match:title ^(Open File|Save File|Open Folder|Choose.*)$

# Never let a fullscreen window blank the screen
windowrule = idle_inhibit fullscreen, match:class .*
