# Ypsilon — decoration: GLASS + ROUNDED. This is the signature look.
decoration {
  rounding = 18
  rounding_power = 3
  active_opacity = 1.0
  inactive_opacity = 0.96
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.12

  shadow {
    enabled = true
    range = 24
    render_power = 3
    color = rgba(00000073)
  }

  blur {
    enabled = true
    size = 12
    passes = 3
    new_optimizations = true
    ignore_opacity = false
    noise = 0.02
    vibrancy = 0.18
    vibrancy_darkness = 0.0
    popups = true
    popups_ignorealpha = 0.6
  }
}
