# Ypsilon — input
input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = true
    clickfinger_behavior = true
  }
  sensitivity = 0
}
gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, exec, ags toggle -i ypsilon ypsilon-overview   # workspace overview
gesture = 4, vertical, special, magic                                       # scratchpad
