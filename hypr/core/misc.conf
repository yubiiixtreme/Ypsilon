# Ypsilon — misc, layouts, cursor, xwayland. Validated by scripts/check.sh.
misc {
  force_default_wallpaper = 0
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  key_press_enables_dpms = true
  vrr = 1                         # adaptive sync for fullscreen apps only
  focus_on_activate = true        # apps asking for focus (links, notifications) get it
  animate_manual_resizes = true
  animate_mouse_windowdragging = true
  middle_click_paste = false
}

dwindle {
  preserve_split = true
  smart_split = false
}

master {
  new_status = master
}

binds {
  workspace_back_and_forth = true # SUPER+N twice returns to the previous workspace
  allow_workspace_cycles = true
}

cursor {
  no_hardware_cursors = false
  hide_on_key_press = true
}

xwayland {
  force_zero_scaling = true       # crisp XWayland apps on scaled monitors
}

ecosystem {
  no_update_news = true
  no_donation_nag = true
}
