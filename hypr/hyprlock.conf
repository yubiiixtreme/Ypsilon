# Ypsilon — hyprlock (glass lockscreen). Colors follow the active theme.
# TEMPLATE — gen-theme.py renders it to hypr/generated/hyprlock.conf with the real repo path.
# Run: `ypsilon lock`
source = @YPSILON@/hypr/themes/lock-current.conf

general {
    hide_cursor = true
    grace = 0
}

# `screenshot` = blurred snapshot of whatever wallpaper/windows are on screen
background {
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    brightness = 0.7
}

label {
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    font_size = 110
    font_family = Inter ExtraBold
    color = $y_fg
    position = 0, 190
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"
    font_size = 22
    font_family = Inter
    color = $y_muted
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    size = 340, 58
    rounding = 20
    dots_center = true
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = true
    font_color = $y_fg
    inner_color = $y_field
    outer_color = $y_ring
    check_color = $y_check
    fail_color = $y_bad
    outline_thickness = 2
    placeholder_text = <i>$USER</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -30
    halign = center
    valign = center
}

label {
    text = cmd[update:30000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 | sed 's/.*/battery &%/')"
    font_size = 14
    font_family = Inter
    color = $y_muted
    position = -24, 20
    halign = right
    valign = bottom
}
