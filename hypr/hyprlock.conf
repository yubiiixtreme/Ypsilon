# Ypsilon — hyprlock (glass lockscreen). Standalone; enable via install.sh or:
#   bind = $mod, L, exec, pidof hyprlock || hyprlock -c ~/Projects/Ypsilon/hypr/hyprlock.conf
background {
    path = ~/Projects/Ypsilon/assets/wallpapers/ypsilon-dark.png
    blur_passes = 3
    blur_size = 8
    noise = 0.02
}

input-field {
    size = 320, 56
    rounding = 18
    dots_center = true
    fade_on_empty = true
    font_color = rgb(e6e9f5)
    inner_color = rgba(18, 23, 43, 180)
    outer_color = rgba(124, 124, 255, 120)
    outline_thickness = 2
    placeholder_text = <i>ypsilon</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
}

label {
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    font_size = 96
    font_family = Inter
    color = rgba(230, 233, 245, 230)
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date '+%a %d %b')"
    font_size = 22
    font_family = Inter
    color = rgba(139, 147, 184, 230)
    position = 0, 60
    halign = center
    valign = center
}
