# Ypsilon Hyprland entry — SAFE to source, does not touch Caelestia.
# To try: ypsilon try (nested), or install.sh for a login session. Paths below are relative to this file.
# Revert: just do not use this config; your own Hyprland setup is never edited.

# repo location ($YPSILON, $ypsilon, env YPSILON_ROOT) — written by scripts/gen-theme.py
source = generated/paths.conf
source = core/env.conf
source = core/monitors.conf
source = core/general.conf
source = core/decoration.conf
source = core/animations.conf
source = core/input.conf
source = core/keybinds.conf
source = core/rules.conf
source = core/execs.conf
source = core/misc.conf
# your Settings / config.json (gaps, rounding, blur, keyboard, ...) — generated
source = generated/user.conf
# Theme colors LAST so they override core (generated by scripts/gen-theme.py).
source = themes/current.conf
