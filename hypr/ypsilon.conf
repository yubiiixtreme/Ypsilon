# Ypsilon Hyprland entry — SAFE to source, does not touch Caelestia.
# To try: add `source = ~/Projects/Ypsilon/hypr/ypsilon.conf` to your hyprland.conf, then `hyprctl reload`.
# To revert: remove that line, `hyprctl reload`.

source = ~/Projects/Ypsilon/hypr/core/env.conf
source = ~/Projects/Ypsilon/hypr/core/monitors.conf
source = ~/Projects/Ypsilon/hypr/core/general.conf
source = ~/Projects/Ypsilon/hypr/core/decoration.conf
source = ~/Projects/Ypsilon/hypr/core/animations.conf
source = ~/Projects/Ypsilon/hypr/core/input.conf
source = ~/Projects/Ypsilon/hypr/core/keybinds.conf
source = ~/Projects/Ypsilon/hypr/core/rules.conf
source = ~/Projects/Ypsilon/hypr/core/execs.conf
source = ~/Projects/Ypsilon/hypr/core/misc.conf
# Theme colors LAST so they override core (generated by scripts/gen-theme.py).
source = ~/Projects/Ypsilon/hypr/themes/current.conf
